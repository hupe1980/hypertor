name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: release
  cancel-in-progress: false

# Everything for the Python bindings — `pyproject.toml` included — lives in
# `bindings/python`, so every maturin invocation runs there. Run it from the
# repository root and it finds no `pyproject.toml`, picks up the plain `hypertor`
# library crate, and fails with "Couldn't detect the binding type".
#
# No `--features` is passed anywhere. `hypertor-python` declares none of its
# own; it pins what it needs on `hypertor` in its own manifest, `static-sqlite`
# included, so a wheel does not depend on the user's system libsqlite3.

jobs:
  # ============================================================================
  # The tag must agree with the manifests
  # ============================================================================
  # crates.io and PyPI publishes are both irreversible. A tag that disagrees
  # with Cargo.toml would publish the wrong version under the right name, and
  # neither registry lets you take it back.
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          bindings=$(sed -n '/^\[package\]/,/^\[/p' bindings/python/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "tag=$tag crate=$crate bindings=$bindings"
          [ "$tag" = "$crate" ] || { echo "::error::tag $tag != hypertor $crate"; exit 1; }
          [ "$tag" = "$bindings" ] || { echo "::error::tag $tag != hypertor-python $bindings"; exit 1; }

  # ============================================================================
  # Build Python wheels
  # ============================================================================
  python-wheels:
    name: Wheel (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --compatibility manylinux2014 --zig
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: --compatibility manylinux2014 --zig
          - os: macos-latest
            target: aarch64-apple-darwin
            args: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            args: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pip install maturin

      - uses: goto-bus-stop/setup-zig@v2
        if: contains(matrix.args, '--zig')
        with:
          version: 0.11.0

      # One wheel per platform covers every interpreter from 3.10 up, because
      # `hypertor-python` builds against the stable ABI — see the `abi3-py310`
      # feature on pyo3 in bindings/python/Cargo.toml. The wheel comes out
      # tagged `cp310-abi3` whichever interpreter builds it; `-i python3.11`
      # only pins which one that is, which matters when cross-compiling.
      - name: Build
        working-directory: bindings/python
        run: maturin build --release --target ${{ matrix.target }} ${{ matrix.args }} -i python3.11

      # maturin writes into the *workspace* target directory, which is the
      # repository root's, not bindings/python's.
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # ============================================================================
  # Source distribution
  # ============================================================================
  sdist:
    name: Source distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install maturin

      # maturin vendors the path dependency on `../..`, so the tarball carries
      # the `hypertor` library source too and builds standalone.
      - name: Build
        working-directory: bindings/python
        run: maturin sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz
          if-no-files-found: error

  # ============================================================================
  # Publish to crates.io
  # ============================================================================
  # Gated on the artefacts building. A crates.io release cannot be withdrawn,
  # only yanked, so publishing it before knowing the wheels compile would leave
  # a permanent version that the Python package never shipped alongside.
  publish-crates:
    name: Publish to crates.io
    needs: [check-version, python-wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `--locked` publishes the dependency versions that were tested rather
      # than whatever resolves at release time.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ============================================================================
  # Publish to PyPI (Trusted Publisher / OIDC)
  # ============================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: [python-wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
