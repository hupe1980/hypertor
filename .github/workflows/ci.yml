name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Code quality
  # ---------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features full -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      # Windows has no system SQLite, which arti's state store needs.
      - name: Test (rustls)
        if: matrix.os != 'windows-latest'
        run: cargo test --features full

      - name: Test (rustls, static sqlite)
        if: matrix.os == 'windows-latest'
        run: cargo test --features "full,static-sqlite"

      # native-tls is a supported alternative and must keep working.
      - name: Test (native-tls)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --no-default-features --features "client,server,socks,ws,native-tls"

  # ---------------------------------------------------------------------------
  # Feature combinations
  # ---------------------------------------------------------------------------
  features:
    name: Features (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "client"
          - "server"
          - "socks"
          - "ws"
          - "full"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features "${{ matrix.features }}"

  # A TLS backend is mandatory, and `server` must build without `client`.
  features-exotic:
    name: Features (unusual combinations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Server only, no client
        run: cargo check --no-default-features --features "server,rustls"
      - name: native-tls without rustls
        run: cargo check --no-default-features --features "client,native-tls"

  # ---------------------------------------------------------------------------
  # Documentation
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo +nightly doc --features full --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # ---------------------------------------------------------------------------
  # MSRV
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features full

  # ---------------------------------------------------------------------------
  # Supply chain
  # ---------------------------------------------------------------------------
  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans advisories sources

  # A privacy library must not contain unreviewed unsafe code. `forbid` in
  # lib.rs enforces this at compile time; this asserts the attribute is present.
  no-unsafe:
    name: No unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify forbid(unsafe_code)
        run: |
          grep -q '#!\[forbid(unsafe_code)\]' src/lib.rs \
            || { echo "src/lib.rs must keep #![forbid(unsafe_code)]"; exit 1; }
          echo "ok"

  # ---------------------------------------------------------------------------
  # Coverage
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --features full --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Python bindings
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2

      - run: pip install maturin pytest pytest-asyncio mypy ruff
      - run: maturin build --features python --release
      - run: pip install --find-links target/wheels hypertor

      - name: Test
        run: pytest python/tests -v

      - name: Lint
        run: |
          ruff check python/ python_examples/
          ruff format --check python/ python_examples/

      - name: Type-check the stubs
        run: mypy python/hypertor

  # ---------------------------------------------------------------------------
  # Release readiness
  # ---------------------------------------------------------------------------
  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      - run: cargo semver-checks check-release --default-features
        # 0.3.0 is a deliberate breaking release; advisory until 1.0.
        continue-on-error: true

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run
