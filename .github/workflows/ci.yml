name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Code quality
  # ---------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features full -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      # Windows has no system SQLite, which arti's state store needs.
      - name: Test (rustls)
        if: matrix.os != 'windows-latest'
        run: cargo test --features full

      - name: Test (rustls, static sqlite)
        if: matrix.os == 'windows-latest'
        run: cargo test --features "full,static-sqlite"

      # native-tls is a supported alternative and must keep working.
      - name: Test (native-tls)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --no-default-features --features "client,server,socks,ws,native-tls"

  # ---------------------------------------------------------------------------
  # Feature combinations
  # ---------------------------------------------------------------------------
  features:
    name: Features (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "client"
          - "server"
          - "socks"
          - "ws"
          - "full"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features "${{ matrix.features }}"

  # A TLS backend is mandatory, and `server` must build without `client`.
  features-exotic:
    name: Features (unusual combinations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Server only, no client
        run: cargo check --no-default-features --features "server,rustls"
      - name: native-tls without rustls
        run: cargo check --no-default-features --features "client,native-tls"
      - name: No features at all
        run: cargo check --no-default-features

      # A TLS backend is mandatory — Tor's link protocol is itself TLS — and
      # Cargo features cannot express "requires one of". Without the
      # `compile_error!` in src/lib.rs this fails a crate away with `unresolved
      # import tor_rtcompat::PreferredRuntime`, which names neither the cause
      # nor the fix. Assert the diagnostic, not just the failure.
      - name: A missing TLS backend is diagnosed, not left to a stray import
        run: |
          for features in client server socks ws; do
            out=$(cargo check --no-default-features --features "$features" 2>&1) && {
              echo "::error::--features $features built without a TLS backend"; exit 1; }
            grep -q 'hypertor needs a TLS backend' <<<"$out" || {
              echo "::error::--features $features failed without the explanatory error:"
              echo "$out" | grep -E '^error' | head -5; exit 1; }
            echo "ok: $features"
          done

  # ---------------------------------------------------------------------------
  # Documentation
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo +nightly doc --features full --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # ---------------------------------------------------------------------------
  # MSRV
  # ---------------------------------------------------------------------------
  # arti 0.45 requires 1.91; a lower floor here would only fail deep inside a
  # dependency with an error that names the wrong crate.
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features full

  # ---------------------------------------------------------------------------
  # Supply chain
  # ---------------------------------------------------------------------------
  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans advisories sources

  # A privacy library must not contain unreviewed unsafe code. `forbid` in
  # lib.rs enforces this at compile time; this asserts the attribute is present.
  no-unsafe:
    name: No unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify forbid(unsafe_code)
        run: |
          grep -q '#!\[forbid(unsafe_code)\]' src/lib.rs \
            || { echo "src/lib.rs must keep #![forbid(unsafe_code)]"; exit 1; }
          echo "ok"

  # ---------------------------------------------------------------------------
  # Coverage
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --features full --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Python bindings
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2

      - run: pip install maturin pytest pytest-asyncio mypy ruff

      # Everything for the bindings lives in one directory, pyproject.toml
      # included, so maturin needs no path overrides.
      - name: Build the wheel
        working-directory: bindings/python
        run: maturin build --release

      - name: Install it
        working-directory: bindings/python
        run: pip install --find-links ../../target/wheels hypertor

      # Offline by default; the `network` marker is deselected in pyproject.toml.
      - name: Test
        working-directory: bindings/python
        run: pytest -v

      - name: Lint
        working-directory: bindings/python
        run: |
          ruff check hypertor/ tests/ examples/
          ruff format --check hypertor/ tests/ examples/

      - name: Type-check the stubs
        working-directory: bindings/python
        run: mypy hypertor

      # The bindings are a separate crate, so the main clippy and test jobs do
      # not see them. Run both here, where a Python interpreter is available to
      # link against — the crate does not enable `pyo3/extension-module`, so a
      # test binary links libpython and the unit tests actually run.
      - name: Clippy (bindings)
        run: cargo clippy -p hypertor-python --all-targets -- -D warnings

      # These cover the handler-return-value contract that the whole Python
      # `OnionApp` rests on — what a str, dict, tuple or None becomes. Nothing
      # else executes them.
      - name: Test (bindings)
        run: cargo test -p hypertor-python

  # ---------------------------------------------------------------------------
  # Release readiness
  # ---------------------------------------------------------------------------
  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      - run: cargo semver-checks check-release --default-features
        # 0.4.0 is a deliberate breaking release; advisory until 1.0.
        continue-on-error: true

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run

      # The published crate must never carry the Python bindings: they would
      # drag pyo3 into every Rust consumer's dependency graph for a feature none
      # of them can use.
      - name: The published tarball contains no bindings
        run: |
          if cargo package --list | grep -qE '^(bindings|python)/'; then
            echo "the Python bindings leaked into the published package"; exit 1
          fi
          if cargo tree --all-features -e normal | grep -qi pyo3; then
            echo "pyo3 reachable from the published crate"; exit 1
          fi
          echo ok
