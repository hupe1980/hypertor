[package]
name = "hypertor-python"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
authors = ["hupe1980"]
repository = "https://github.com/hupe1980/hypertor"
license = "MIT"
description = "Python bindings for hypertor (built by maturin, not published to crates.io)"

# This crate exists only to be compiled into a Python extension module. It has
# no Rust API of its own, its version is the Python package's version rather
# than the library's, and publishing it to crates.io would mean every Rust user
# browsing `hypertor` also saw a pyo3 dependency they can never use.
publish = false

[lib]
# Named for the module it becomes: maturin installs the artifact as
# `hypertor/_hypertor.<ext>` inside the wheel (see `[tool.maturin]` in
# ../../pyproject.toml), and the name must match the `#[pymodule]` function.
name = "_hypertor"
crate-type = ["cdylib"]

[dependencies]
# The library, used through its public API exactly as any other consumer would.
# Nothing here reaches into hypertor's internals; if the bindings need something
# that is not public, that is a signal the Rust API is missing it.
# `static-sqlite` is not a platform workaround here, it is what makes a wheel a
# wheel: the artifact is installed by `pip` onto a machine with no Rust
# toolchain and no say in its dependencies, so linking arti's state store
# against whatever `libsqlite3` happens to be on that system — or is missing
# from it, as on Windows — would turn a working build into an import error for
# the user. The release workflow therefore passes no `--features` at all; if it
# needed to, that would be a feature this crate does not have.
hypertor = { path = "../..", default-features = false, features = [
    "client",
    "server",
    "rustls",
    "static-sqlite",
] }

# `extension-module` is added by maturin rather than declared here, so that
# `cargo build`/`cargo test` in this workspace link against libpython and work.
# Under `extension-module` the CPython symbols are left for a loading
# interpreter to supply, which is correct in a wheel and a link error anywhere
# else — including in a test binary.
# `abi3-py310` builds against CPython's stable ABI, so one wheel per platform
# covers every interpreter from 3.10 up — which is exactly what
# `requires-python = ">=3.10"` and the classifiers promise. Without it a build
# is tagged for the single interpreter that produced it (`cp311-cp311`), and
# everyone on 3.10, 3.12 or 3.13 falls back to the sdist and has to compile arti
# with a Rust toolchain they were told they would not need.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

http = "1.2"
parking_lot = "0.12.5"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"

# `panic = "abort"` must never be set for this crate: it is loaded into a host
# interpreter, and a Rust panic has to be caught at the FFI boundary rather than
# taking the whole Python process down with it.
